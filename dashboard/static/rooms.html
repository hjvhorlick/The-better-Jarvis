<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS — Rooms</title>
  <!-- Relative URLs (the room modules, styles) resolve under the engine sources. -->
  <base href="/rooms-src/">
  <!-- ONE look: the same clear-glass tokens, the same thin yellow lines, the
       same rounded face (Nunito, vendored in the repo) as the dashboard. -->
  <link rel="stylesheet" href="/static/jarvis-glass.css">
  <!-- three.js is vendored with the project; the import map lets the 3D room and
       its loaders find it without a build step and without the internet. -->
  <script type="importmap">
  {
    "imports": {
      "three": "/vendor/three/three.module.js",
      "three/addons/": "/vendor/three/"
    }
  }
  </script>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* This page shows ONLY the sliding rooms: it fills the frame it is embedded in. */
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; overflow: hidden; }
    .rooms-top { display: flex; align-items: center; gap: 8px; padding: 8px 10px 6px; flex: 0 0 auto; }
    .env-rail { flex: 1 1 auto; min-height: 0; }

    /* ── Simplicity, in the rooms as much as on the main screen ────────────
       A room is a place to work, not a control panel: the bar holds the rooms
       themselves, the two arrows, and ONE switch — Tools. The room's own tools
       appear when Tools is pressed (or when you say "tools"), and everything
       else is driven by voice and hand. The camera switch lives on the main
       screen only (and by voice: "camera on"), so there is exactly one. */
    .rooms-top .env-switcher { flex: 1 1 auto; flex-wrap: wrap; }
    .rooms-switch {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 14px; font-size: 13.5px; font-weight: 700;
      letter-spacing: 0.03em; cursor: pointer;
    }
    .rooms-switch[aria-pressed="true"] {
      background: rgba(255, 214, 10, 0.30); color: #14151a;
      border-color: var(--jg-gold-bright);
    }

    /* Keep the supported 16:9 / 9:16 Studio aspect selector visible. */
    #env-fps { display: none !important; }
    label[for="studio-model"], #studio-model { display: none !important; }

    /* The Flat room's tool drawer: the real design tools live in this
       sub-section, and they are out of the way until Tools is pressed. */
    .flat-drawer {
      display: flex; flex-wrap: wrap; gap: 8px;
      padding: 8px 12px; flex: 0 0 auto;
      background: rgba(18, 20, 24, var(--jg-room-alpha));
      border: var(--jg-line-width) solid var(--jg-line);
      border-radius: var(--jg-radius);
      box-shadow: 0 0 var(--jg-glow-size) var(--jg-glow);
    }
    .flat-group {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 9px; border-radius: var(--jg-radius);
      background: rgba(18, 20, 24, var(--jg-panel-alpha, 0.34));
      border: var(--jg-line-width) solid var(--jg-line-soft);
    }
    .flat-group-title {
      font: 700 10px/1 var(--jg-font); letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--jg-gold); margin-right: 2px;
    }

    /* The chooser: the AI made two takes, the owner picks one. */
    .flat-choices {
      position: absolute; inset: 0; z-index: 40;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; background: rgba(18, 20, 24, var(--jg-panel-alpha, 0.34));
      border: var(--jg-line-width) solid var(--jg-line);
    }
    .flat-choices-title { margin: 0; font: 700 16px/1.4 var(--jg-font); color: var(--jg-gold-bright); letter-spacing: 0.04em; }
    .flat-choices-row { display: flex; gap: 20px; align-items: center; justify-content: center; max-width: 92%; }
    .flat-choices-row img {
      max-width: 42vw; max-height: 60vh; border-radius: var(--jg-radius); cursor: pointer;
      border: var(--jg-line-width) solid var(--jg-line);
      box-shadow: 0 0 var(--jg-glow-size) var(--jg-glow), 0 24px 50px -20px rgba(0, 0, 0, 0.9);
      transition: transform 0.15s ease, border-color 0.15s ease;
    }
    .flat-choices-row img:hover { transform: scale(1.03); border-color: var(--jg-gold-bright); }
    .flat-choices button {
      padding: 10px 18px; border-radius: var(--jg-radius); cursor: pointer;
      background: rgba(255, 255, 255, 0.05); border: var(--jg-line-width) solid var(--jg-line);
      color: var(--jg-gold-bright); font: 700 13px/1 var(--jg-font);
    }
    .flat-choices button:hover { background: rgba(255, 214, 10, 0.18); }

    /* Big, fingerable targets everywhere, now with a yellow line. */
    .env-switch { font-size: 14px; padding: 9px 16px; border-radius: var(--jg-radius); }
    .env-tool { font-size: 13.5px; padding: 8px 13px; border-radius: var(--jg-radius); }
    .env-arrow { font-size: 22px; padding: 6px 18px; border-radius: var(--jg-radius); }
    .env-tool-control input[type="range"] { min-height: 30px; }
    .env-tool-control input[type="color"] { width: 42px; height: 34px; }
  </style>
</head>
<body>
  <!-- The picture behind the glass: the dashboard's live camera, handed over
       (see /rooms-src/camera.js). When it is off, the dark grey room shows. -->
  <video id="env-camera" class="jg-cam" autoplay playsinline muted></video>
  <img id="env-camera-mirror" class="jg-cam" alt="" hidden>
  <div id="env-camera-scrim"></div>

  <div class="rooms-top">
    <nav id="env-switcher" class="env-switcher" aria-label="Rooms"></nav>
    <button type="button" id="env-tools-toggle" class="rooms-switch" aria-pressed="false"
            title="Show this room's tools">🧰 Tools</button>
  </div>

  <!-- The windowing environment: one rail, sliding left and right. -->
  <section class="env-rail" id="env-rail" aria-label="Workspace">
    <div class="env-bar">
      <button type="button" id="env-prev" class="env-arrow" aria-label="Previous environment" disabled>‹</button>
      <span class="env-label" id="env-label">JARVIS Rooms</span>
      <span class="env-fps d3-fps" id="env-fps" aria-hidden="true"></span>
      <button type="button" id="env-next" class="env-arrow" aria-label="Next environment" disabled>›</button>
    </div>
    <div class="env-track" id="env-track"></div>
  </section>

  <script>
    // The room modules call the file and media APIs with plain fetch. The main
    // build guards those routes with the session token, so it is added here.
    (() => {
      const token = sessionStorage.getItem('jarvis_token') || 'jarvis-live-session-token';
      const realFetch = window.fetch.bind(window);
      window.fetch = (input, init) => {
        const url = typeof input === 'string' ? input : input.url;
        if (url.startsWith('/api/')) {
          init = init || {};
          init.headers = Object.assign({}, init.headers, { 'Authorization': `Bearer ${token}` });
        }
        return realFetch(input, init);
      };
    })();
  </script>
  <script src="shell.js"></script>
  <script src="environments/register.js"></script>
  <script src="camera.js"></script>
</body>
</html>
